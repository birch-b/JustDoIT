# Nginx 站点配置：静态前端 + /api 反代后端 + 可选 HTTPS
# 位置：服务器 /etc/nginx/sites-available/jdi（或 conf.d/jdi.conf）
# 使用前把 <SERVER_IP> 替换为你的服务器公网 IP

# ── HTTP 站点（没证书时先用这个就能跑）──
server {
    listen 80;
    server_name <SERVER_IP>;

    # 前端静态文件（pnpm build 产物上传到 /var/www/jdi）
    root /var/www/jdi;
    index index.html;

    # API 反代到后端（后端只监听 127.0.0.1:3000，不公网暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

