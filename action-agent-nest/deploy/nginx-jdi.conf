# Nginx 站点配置：静态前端 + /api 反代后端 + HTTPS
# 位置：服务器 /etc/nginx/sites-available/jdi（或 conf.d/jdi.conf）
# 使用前把 <SERVER_IP> 替换为你的服务器公网 IP
#
# 本版相比旧版新增（均为性能项，不改任何业务行为）：
#   1. gzip 压缩（JS/CSS/JSON/SVG）—— 旧版没有，资源是裸传的
#   2. /assets/ 一年强缓存 —— 旧版没有缓存头，每次进页面都重新验证
#   3. index.html 不缓存 —— 保证发版后立刻生效
#   4. HTTPS 开启 HTTP/2 —— 首屏十几个请求不用挤 6 个连接
#   5. /api/ 放宽超时 —— 建议引擎要调大模型，默认 60s 可能不够

# ── 压缩（gzip 是「响应压缩」，和浏览器发的 Accept-Encoding 请求头是两回事）──
# 重要：/etc/nginx/nginx.conf 第 49 行已经有 gzip on; 了，所以这里不能再写 gzip on;，
#       否则会报 "duplicate directive" 导致 nginx -t 失败。
#       问题出在 Ubuntu 默认的 gzip_types 只有 text/html —— JS/CSS 从来没被压缩过。
#       所以这里只补 gzip_types，不改 gzip on。
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;
# 图片（png/jpg/webp）与字体（woff2）本身已是压缩格式，不列入 gzip_types

# ── HTTP 站点 ──
server {
    listen 80;
    server_name <SERVER_IP>;

    # 前端静态文件（pnpm build 产物上传到 /var/www/jdi）
    root /var/www/jdi;
    index index.html;

    # API 反代到后端（后端只监听 127.0.0.1:3000，不公网暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 建议引擎会调用大模型，读超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # 带 hash 的构建产物：一年强缓存（Vite 产物文件名含内容 hash，内容永不变化）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html 禁止强缓存，保证发版后立刻取到新版本（避免旧 HTML 引旧 chunk）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS 站点 ──
# 前置条件：证书已存在（bash scripts/gen-self-signed-cert.sh <公网IP> 后上传到 /etc/nginx/certs/）
# 若证书还不存在，请先注释掉整个 443 块，否则 nginx -t 会失败导致 reload 不生效
server {
    # nginx 1.18 用这种写法；nginx >= 1.25.1 可写成 "listen 443 ssl;" + 单独一行 "http2 on;"
    listen 443 ssl http2;
    server_name <SERVER_IP>;

    ssl_certificate     /etc/letsencrypt/live/8.166.131.200/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.166.131.200/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/jdi;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
